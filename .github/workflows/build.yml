name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Unit and integration tests
        run: go test ./... -timeout 300s -v 2>&1 | tail -80

      - name: Race detector on the engine
        run: go test ./internal/engine -race -timeout 300s

  build:
    name: Build Windows binaries
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify the icon generator still produces valid assets
        run: |
          # The generator must run cleanly and emit valid PNG/ICO files. The
          # bytes themselves are allowed to differ between zlib builds, so this
          # checks structure rather than hashing.
          cp chrome-extension/icons/icon128.png /tmp/icon128.before
          python3 tools/make_icons.py
          python3 - <<'PY'
          import struct, sys, os
          ok = True
          for p in ("chrome-extension/icons/icon16.png",
                    "chrome-extension/icons/icon32.png",
                    "chrome-extension/icons/icon48.png",
                    "chrome-extension/icons/icon128.png"):
              with open(p, "rb") as f:
                  head = f.read(26)
              if head[:8] != b"\x89PNG\r\n\x1a\n" or head[25] != 6:
                  print("not a valid RGBA PNG:", p); ok = False
          with open("assets/superidm.ico", "rb") as f:
              data = f.read()
          reserved, kind, count = struct.unpack("<HHH", data[:6])
          if reserved != 0 or kind != 1 or count < 4:
              print("invalid ICO header:", reserved, kind, count); ok = False
          if not os.path.getsize("internal/app/trayicon_windows.go") > 1000:
              print("tray icon source was not generated"); ok = False
          sys.exit(0 if ok else 1)
          PY

      - name: Build release bundle
        run: |
          VERSION="${{ github.ref_type == 'tag' && github.ref_name || '1.0.0' }}"
          VERSION="${VERSION#v}"
          VERSION="$VERSION" bash build.sh

      - name: Show artifacts
        run: ls -lh dist

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SuperIDM-windows
          path: |
            dist/SuperIDM.exe
            dist/SuperIDM-cli.exe
            dist/SuperIDM-arm64.exe
            dist/SuperIDM-chrome-extension-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish a GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: SuperIDM ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          body: |
            ## SuperIDM ${{ github.ref_name }}

            Download `SuperIDM-v*-windows-x64.zip`, extract it, and run `SuperIDM.exe`.

            Then load the browser extension:
            `chrome://extensions` → Developer mode → **Load unpacked** →
            select the `chrome-extension` folder from the extracted archive.

            `SHA256SUMS.txt` contains the checksums for every file in this release.
          files: |
            dist/SuperIDM-v*-windows-x64.zip
            dist/SuperIDM-chrome-extension-*.zip
            dist/SuperIDM.exe
            dist/SuperIDM-cli.exe
            dist/SuperIDM-arm64.exe
            dist/SHA256SUMS.txt
